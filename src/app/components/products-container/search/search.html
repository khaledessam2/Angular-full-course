<div class="my-3">
  <div class="d-flex gap-3 my-3">
    <input #input type="text" class="form-control" placeholder="Search For A product" (keydown.enter)="Search()"/>
    <button class="btn btn-danger" (click)="Search()"> Search </button>
    <!-- [ngClass]="{ 'pointer' : value , 'not-allowed' : !value , 'btn' : true , 'btn-danger' : true}" -->
  </div>
  <p *ngIf="input.value">
    Search Result For : <span class="fw-bold">{{ input.value }}</span>
  </p>
</div>
