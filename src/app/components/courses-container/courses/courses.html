<app-filter
  [All]="AllCount"
  [Free]="FreeCount"
  [premium]="PremiumCount"
  (SelectedRadioButton)="OnFilterChanged($event)"
></app-filter>

<p *ngIf="filterCourses.length === 0" class="text-center text-muted my-4">
  No courses match your filter.
</p>
<div class="row g-3">
  <div appHeighlight class="col-sm-6 col-md-4 col-lg-3 cursor-pointer d-flex" *ngFor="let Course of filterCourses; let i = index">
    <div class="card course-card h-80">
      <div class="course-img-wrap">
        <img [src]="Course.image" class="card-img-top product-img" [alt]="Course.name" />
        <span class="price-badge" [ngStyle]="{ background: Course.price === 'Free' ? 'var(--color-primary)' : 'var(--color-dark)' }">
          {{ Course.price === 'Free' ? 'Free' : '$' + Course.price }}
        </span>
      </div>
      <div class="card-body d-flex flex-column">
        <h3 [SetBackground]="{'textColor' : 'var(--color-dark)' , 'FontWeight' : '700'}" class="fs-5 course-title">{{ Course.name }}</h3>
        <p class="flex-grow-1 course-desc">{{ Course.description }}</p>
        <span class="stock-badge mb-3" [ngStyleDir]="{ fontWeight: '600', color : Course.is_in_inventory ? '#1a9c53' : 'var(--color-primary)' }">
          <i class="fa-solid" [ngClass]="Course.is_in_inventory ? 'fa-circle-check' : 'fa-circle-xmark'"></i>
          {{ Course.is_in_inventory ? 'In Stock' : 'Out of Stock' }}
        </span>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-buy flex-grow-1" routerLink="checkout"><i class="fa-solid fa-cart-shopping me-1"></i>Buy</button>
          <button class="btn btn-details flex-grow-1" (click)="GoToDetails(Course.id)">Details</button>
        </div>
      </div>
    </div>
  </div>
</div>
