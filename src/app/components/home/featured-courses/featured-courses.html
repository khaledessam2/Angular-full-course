<div class="featured-courses">
  <div class="section-header">
    <h1>Featured Courses</h1>
    <p>Handpicked courses to help you start your learning journey.</p>
  </div>

  <div class="courses-grid">
    <div class="course-card" *ngFor="let course of courses" (click)="GoToDetails(course.id)">
      <div class="course-img-wrap">
        <img [src]="course.image" [alt]="course.name" class="course-img" />
        <span class="price-badge" [ngStyle]="{ background: course.price === 'Free' ? 'var(--color-primary)' : 'var(--color-dark)' }">
          {{ course.price === 'Free' ? 'Free' : '$' + course.price }}
        </span>
      </div>
      <div class="course-body">
        <span class="category">{{ course.category }}</span>
        <h3>{{ course.name }}</h3>
        <p class="desc">{{ course.description }}</p>
        <div class="rating">
          <i class="fa-solid fa-star" *ngFor="let star of stars(course.rating)"></i>
          <span class="rating-value">{{ course.rating }}</span>
          <span class="reviews">({{ course.reviews }} reviews)</span>
        </div>
      </div>
    </div>
  </div>

  <div class="view-all-wrap">
    <button class="view-all-btn" (click)="GoToAllCourses()">View All Courses</button>
  </div>
</div>
